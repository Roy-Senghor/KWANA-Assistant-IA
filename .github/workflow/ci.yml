name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kwana
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: kwana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwana -d kwana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://kwana:ci_password@localhost:5432/kwana
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer les tests
        run: python -m pytest tests -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install
      - name: Construire l'application
        run: npm run build

  docker:
    name: Docker (build des images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image de l'API
        run: docker build -t kwana-api ./api
      - name: Construire l'image du frontend
        run: docker build -t kwana-frontend ./frontend
